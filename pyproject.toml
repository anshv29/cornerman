[project]
name = "cornerman"
version = "0.1.0"
description = "Learns how amateur MMA fighters fight from public footage, and simulates matchups."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.5",
    "scipy>=1.18",
    "pandas>=3.0",
    "pyarrow>=26.0",
    "pandera>=0.34",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pyyaml>=6.0",
    "yt-dlp>=2026.1",
    "deno>=2.9.7",
]

[project.optional-dependencies]
# Perception models. Installed on Kaggle (which already has torch with CUDA)
# and, with CPU torch, on the laptop and in CI so types and tests cover them.
gpu = [
    "rfdetr==1.11.2",
    "trackers==2.6.1",
    "transformers==5.20.1",
    "transnetv2-pytorch==1.0.5",
    "supervision==0.31.0",
    "opencv-python>=4.10",
    "imageio-ffmpeg>=0.6",
    "torch>=2.6",
    "torchvision>=0.21",
]

[project.scripts]
cornerman = "cornerman.pipeline.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.17",
    "pyright>=1.1.414",
    "pytest>=9.1",
    "hypothesis>=6.170",
    "pre-commit>=4.7",
    "dvc>=3.67",
    "types-pyyaml",
    "pandas-stubs",
    "scipy-stubs",
]

# On Linux (CI) take CPU-only torch so the install stays small. Kaggle doesn't
# use this lock: it installs with pip on top of its own CUDA torch.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cornerman"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# Strict everywhere. Gaps in third-party stubs (pandas, scipy, pandera) are
# silenced line by line with a rule-specific ignore. See DECISIONS.md.

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
